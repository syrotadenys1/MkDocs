<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Macierzy - Final Fix</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #fff;
        color: #000;
        padding: 20px;
      }

      .top-menu {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 20px;
      }

      .custom-select {
        font-size: 18px;
        border: none;
        border-bottom: 2px solid #ccc;
        padding: 5px;
        outline: none;
        cursor: pointer;
        background: transparent;
        font-weight: 500;
      }
      .custom-select:hover {
        border-color: #90ee90;
      }

      .size-controls {
        display: flex;
        gap: 30px;
        justify-content: center;
        align-items: flex-start;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .matrix-config {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 12px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .matrix-label {
        font-weight: bold;
        font-size: 18px;
      }

      .inputs-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .dim-input {
        width: 50px;
        padding: 8px;
        text-align: center;
        border: 2px solid #000;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        outline: none;
      }

      .dim-input:focus {
        border-color: #90ee90;
      }

      .calculator-area {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .matrix-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: all 0.3s;
      }

      .matrix-grid {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .matrix-input {
        width: 55px;
        height: 55px;
        background-color: #e0e0e0;
        border: 2px solid transparent;
        border-radius: 10px;
        text-align: center;
        font-size: 16px;
        outline: none;
        font-weight: 500;
      }

      .matrix-input:focus {
        border-color: #90ee90;
        background-color: #fff;
      }

      .operator {
        font-size: 32px;
        font-weight: bold;
        margin-top: 60px;
      }

      .hidden {
        display: none !important;
      }

      .result-container {
        width: 100%;
        max-width: 900px;
        background-color: #f2f2f2;
        border: 2px solid #aaffaa;
        border-radius: 20px;
        padding: 25px;
        min-height: 150px;
        box-sizing: border-box;
      }

      .result-header {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .result-content {
        font-family: "Consolas", monospace;
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.6;
        color: #333;
      }

      .error-msg {
        color: #d9534f;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="top-menu">
      <label style="font-size: 14px; color: #666">Wybierz działanie:</label>
      <select
        id="operationSelect"
        class="custom-select"
        onchange="updateMode()"
      >
        <option value="multiply">Mnożenie (A × B)</option>
        <option value="add">Dodawanie (A + B)</option>
        <option value="subtract">Odejmowanie (A - B)</option>
        <option value="det">Wyznacznik (Det A)</option>
        <option value="inverse">Macierz odwrotna (A⁻¹)</option>
      </select>

      <div id="methodContainer" class="hidden" style="margin-top: 10px">
        <select
          id="methodSelect"
          class="custom-select"
          onchange="calculate()"
        ></select>
      </div>
    </div>

    <div class="size-controls">
      <div class="matrix-config">
        <span class="matrix-label">Macierz A</span>
        <div class="inputs-row">
          <input
            type="number"
            id="rowsA"
            class="dim-input"
            value="2"
            min="1"
            max="6"
            oninput="generateGrids()"
          />
          <span>x</span>
          <input
            type="number"
            id="colsA"
            class="dim-input"
            value="2"
            min="1"
            max="6"
            oninput="generateGrids()"
          />
        </div>
      </div>

      <div class="matrix-config" id="configB">
        <span class="matrix-label">Macierz B</span>
        <div class="inputs-row">
          <input
            type="number"
            id="rowsB"
            class="dim-input"
            value="2"
            min="1"
            max="6"
            oninput="generateGrids()"
          />
          <span>x</span>
          <input
            type="number"
            id="colsB"
            class="dim-input"
            value="2"
            min="1"
            max="6"
            oninput="generateGrids()"
          />
        </div>
      </div>
    </div>

    <div class="calculator-area">
      <div class="matrix-wrapper">
        <div id="matrixA" class="matrix-grid"></div>
      </div>

      <div id="operatorSign" class="operator">X</div>

      <div class="matrix-wrapper">
        <div id="matrixB" class="matrix-grid"></div>
      </div>
    </div>

    <div class="result-container">
      <div class="result-header">Rozwiązanie krok po kroku:</div>
      <div id="resultOutput" class="result-content">...</div>
    </div>

    <script>
      // --- Główna logika interfejsu ---

      function updateMode() {
        const op = document.getElementById("operationSelect").value;
        const configB = document.getElementById("configB");
        const matrixBWrapper = document.getElementById("matrixB").parentElement;
        const opSign = document.getElementById("operatorSign");

        // Ukrywanie elementów dla Det/Inverse
        if (op === "det" || op === "inverse") {
          configB.classList.add("hidden");
          matrixBWrapper.classList.add("hidden");
          opSign.classList.add("hidden");

          // Wymuszanie kwadratu
          const r = document.getElementById("rowsA").value;
          document.getElementById("colsA").value = r;
        } else {
          configB.classList.remove("hidden");
          matrixBWrapper.classList.remove("hidden");
          opSign.classList.remove("hidden");
        }

        // Znaki
        if (op === "multiply") opSign.innerText = "×";
        if (op === "add") opSign.innerText = "+";
        if (op === "subtract") opSign.innerText = "-";

        // Zawsze przy zmianie trybu regenerujemy siatkę i metody
        generateGrids();
      }

      // Ta funkcja aktualizuje listę sposobów (Sarrus, Laplace) zależnie od rozmiaru
      function updateMethodList(rows) {
        const op = document.getElementById("operationSelect").value;
        const methodContainer = document.getElementById("methodContainer");
        const methodSelect = document.getElementById("methodSelect");

        // Zachowujemy obecny wybór jeśli to możliwe
        const currentSelection = methodSelect.value;

        methodSelect.innerHTML = "";
        methodContainer.classList.add("hidden");

        if (op === "det") {
          methodContainer.classList.remove("hidden");
          if (rows == 3) {
            // Dla 3x3 mamy dwie opcje
            methodSelect.innerHTML = `
                        <option value="sarrus">Sposób: Reguła Sarrusa</option>
                        <option value="laplace">Sposób: Rozwinięcie Laplace'a</option>
                    `;
          } else if (rows == 2) {
            methodSelect.innerHTML =
              '<option value="std">Sposób: Wzór (ad-bc)</option>';
          } else {
            // Dla 4x4 i innych tylko Laplace (Sarrus nie działa)
            methodSelect.innerHTML =
              '<option value="laplace">Sposób: Rozwinięcie Laplace\'a</option>';
          }
        } else if (op === "inverse") {
          methodContainer.classList.remove("hidden");
          methodSelect.innerHTML =
            '<option value="adj">Sposób: Macierz dopełnień</option>';
        }

        // Jeśli stary wybór wciąż jest na nowej liście, zaznacz go
        // Jeśli nie (np. zmieniliśmy z 3x3 na 4x4 i Sarrus zniknął), wybierze się pierwszy domyślny
        for (let i = 0; i < methodSelect.options.length; i++) {
          if (methodSelect.options[i].value === currentSelection) {
            methodSelect.selectedIndex = i;
            break;
          }
        }
      }

      function generateGrids() {
        let rA = parseInt(document.getElementById("rowsA").value) || 1;
        let cA = parseInt(document.getElementById("colsA").value) || 1;
        let rB = parseInt(document.getElementById("rowsB").value) || 1;
        let cB = parseInt(document.getElementById("colsB").value) || 1;

        const op = document.getElementById("operationSelect").value;

        // Limity
        if (rA > 6) rA = 6;
        if (cA > 6) cA = 6;
        if (rB > 6) rB = 6;
        if (cB > 6) cB = 6;

        // Logika kwadratowa dla Det/Inverse
        if (op === "det" || op === "inverse") {
          cA = rA;
          document.getElementById("colsA").value = cA;
        }

        // KLUCZOWE: Aktualizujemy listę metod przy każdej zmianie rozmiaru
        updateMethodList(rA);

        createGrid("matrixA", rA, cA);
        if (op !== "det" && op !== "inverse") {
          createGrid("matrixB", rB, cB);
        }

        calculate();
      }

      function createGrid(id, rows, cols) {
        const container = document.getElementById(id);
        const currentInputs = container.querySelectorAll("input");
        let oldValues = [];
        currentInputs.forEach((inp) => oldValues.push(inp.value));

        container.innerHTML = "";
        container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        for (let i = 0; i < rows * cols; i++) {
          const inp = document.createElement("input");
          inp.type = "number";
          inp.className = "matrix-input";
          inp.placeholder = "0";
          if (i < oldValues.length) inp.value = oldValues[i];
          else inp.value = 0;

          inp.addEventListener("input", calculate);
          container.appendChild(inp);
        }
      }

      function getMatrix(id, rows, cols) {
        const inputs = document.getElementById(id).querySelectorAll("input");
        let m = [];
        for (let i = 0; i < rows; i++) {
          let row = [];
          for (let j = 0; j < cols; j++) {
            let val = parseFloat(inputs[i * cols + j].value);
            row.push(isNaN(val) ? 0 : val);
          }
          m.push(row);
        }
        return m;
      }

      // --- MATEMATYKA ---

      function calculate() {
        const op = document.getElementById("operationSelect").value;
        const rA = parseInt(document.getElementById("rowsA").value) || 1;
        const cA = parseInt(document.getElementById("colsA").value) || 1;
        const A = getMatrix("matrixA", rA, cA);
        const out = document.getElementById("resultOutput");

        let log = "";

        if (op === "multiply") {
          const rB = parseInt(document.getElementById("rowsB").value) || 1;
          const cB = parseInt(document.getElementById("colsB").value) || 1;
          const B = getMatrix("matrixB", rB, cB);

          if (cA !== rB) {
            out.innerHTML = `<span class="error-msg">Liczba KOLUMN A (${cA}) musi równać się liczbie WIERSZY B (${rB}).</span>`;
            return;
          }

          let C = [];
          for (let i = 0; i < rA; i++) {
            let rowStr = "| ";
            for (let j = 0; j < cB; j++) {
              let sum = 0;
              for (let k = 0; k < cA; k++) sum += A[i][k] * B[k][j];
              rowStr += parseFloat(sum.toFixed(3)) + "   ";
            }
            rowStr += "|";
            C.push(rowStr);
          }
          log = `Wynik mnożenia:\n${C.join("\n")}`;
        } else if (op === "add" || op === "subtract") {
          const rB = parseInt(document.getElementById("rowsB").value);
          const cB = parseInt(document.getElementById("colsB").value);
          const B = getMatrix("matrixB", rB, cB);

          if (rA !== rB || cA !== cB) {
            out.innerHTML = `<span class="error-msg">Wymiary muszą być identyczne!</span>`;
            return;
          }
          const sign = op === "add" ? "+" : "-";
          let C = [];
          for (let i = 0; i < rA; i++) {
            let rowStr = "| ";
            for (let j = 0; j < cA; j++) {
              let val = op === "add" ? A[i][j] + B[i][j] : A[i][j] - B[i][j];
              rowStr += parseFloat(val.toFixed(3)) + "   ";
            }
            rowStr += "|";
            C.push(rowStr);
          }
          log = `Wynik:\n${C.join("\n")}`;
        } else if (op === "det") {
          const method = document.getElementById("methodSelect").value;
          const detVal = getDeterminant(A);

          if (rA === 2) {
            log += `det A = (a11·a22) - (a12·a21)\n`;
            log += `det A = (${A[0][0]}·${A[1][1]}) - (${A[0][1]}·${A[1][0]})\n`;
            log += `Wynik: ${detVal}`;
          } else if (rA === 3 && method === "sarrus") {
            log += "Metoda Sarrusa:\n";
            const p1 = A[0][0] * A[1][1] * A[2][2];
            const p2 = A[0][1] * A[1][2] * A[2][0];
            const p3 = A[0][2] * A[1][0] * A[2][1];
            const m1 = A[0][2] * A[1][1] * A[2][0];
            const m2 = A[0][0] * A[1][2] * A[2][1];
            const m3 = A[0][1] * A[1][0] * A[2][2];
            log += `(+) ${p1} + ${p2} + ${p3} = ${p1 + p2 + p3}\n`;
            log += `(-) ${m1} + ${m2} + ${m3} = ${m1 + m2 + m3}\n`;
            log += `Wynik: ${p1 + p2 + p3 - (m1 + m2 + m3)}`;
          } else {
            log += "Rozwinięcie Laplace'a (lub metoda ogólna):\n";
            log += `Det = ${detVal}`;
          }
        } else if (op === "inverse") {
          const det = getDeterminant(A);
          log += `Wyznacznik = ${parseFloat(det.toFixed(4))}\n`;
          if (Math.abs(det) < 1e-9) {
            log += "Wyznacznik = 0. Brak macierzy odwrotnej.";
          } else {
            let inv = invertMatrix(A, det);
            let resStr = "";
            for (let i = 0; i < rA; i++) {
              resStr += "|  ";
              for (let j = 0; j < rA; j++)
                resStr += inv[i][j].toFixed(3) + "  ";
              resStr += "|\n";
            }
            log += `\nMacierz odwrotna:\n${resStr}`;
          }
        }

        out.innerText = log || "Wprowadź dane...";
      }

      // Helpery matematyczne
      function getDeterminant(m) {
        if (m.length === 1) return m[0][0];
        if (m.length === 2) return m[0][0] * m[1][1] - m[0][1] * m[1][0];
        let det = 0;
        for (let i = 0; i < m.length; i++) {
          let subM = m.slice(1).map((row) => row.filter((_, idx) => idx !== i));
          let sign = i % 2 === 0 ? 1 : -1;
          det += sign * m[0][i] * getDeterminant(subM);
        }
        return det;
      }

      function invertMatrix(M, det) {
        const size = M.length;
        if (size === 1) return [[1 / M[0][0]]];
        let adj = [];
        for (let i = 0; i < size; i++) {
          let row = [];
          for (let j = 0; j < size; j++) {
            let subM = [];
            for (let r = 0; r < size; r++) {
              if (r === i) continue;
              let subRow = [];
              for (let c = 0; c < size; c++) {
                if (c === j) continue;
                subRow.push(M[r][c]);
              }
              subM.push(subRow);
            }
            let sign = (i + j) % 2 === 0 ? 1 : -1;
            row.push(sign * getDeterminant(subM));
          }
          adj.push(row);
        }
        let inv = [];
        for (let i = 0; i < size; i++) {
          let r = [];
          for (let j = 0; j < size; j++) {
            r.push(adj[j][i] / det);
          }
          inv.push(r);
        }
        return inv;
      }

      window.onload = updateMode;
    </script>
  </body>
</html>
